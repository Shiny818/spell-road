<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>スペル・ロード ～カードで駆け引き！魔法すごろく～</title>
  </head>
  <body>
    <div id="app">
      <section id="title" class="screen">
        <h1>
          <img class="logo" src="/assets/ui/logo.png" alt="スペル・ロード ～カードで駆け引き！魔法すごろく～" />
        </h1>
        <button id="sound-title" class="sound-toggle" type="button"></button>
        <div class="title-panel">
          <p class="subtitle">魔法のカードで駆け引きしながら、ゴールを目指そう</p>
          <label class="field">
            <span>なまえ</span>
            <input id="player-name" type="text" maxlength="8" value="あなた" />
          </label>

          <div class="title-section">
            <div class="section-label">ひとりで遊ぶ</div>
            <div class="field">
              <span>CPUの人数</span>
              <div id="cpu-count" class="segmented"></div>
            </div>
            <button id="start" class="btn primary big">CPUと対戦</button>
          </div>

          <div class="title-section">
            <div class="section-label">みんなで遊ぶ（同じWi-Fiで）</div>
            <button id="create-room" class="btn primary">部屋を作る</button>
            <div class="join-row">
              <input id="room-code" type="text" maxlength="7" placeholder="部屋コード" autocomplete="off" autocapitalize="characters" spellcheck="false" />
              <button id="join-room" class="btn">入る</button>
            </div>
          </div>
          <p id="title-message" class="note"></p>
        </div>
      </section>

      <section id="lobby" class="screen hidden">
        <div class="lobby-panel">
          <h2>待合室</h2>
          <div class="lobby-code-box">
            <div class="note">部屋コード</div>
            <div id="lobby-code"></div>
            <div class="note">同じWi-Fiにつないだ人に、このコードを伝えてください</div>
          </div>
          <ol id="lobby-seats"></ol>
          <div id="lobby-controls"></div>
          <button id="lobby-leave" class="btn">部屋を出る</button>
        </div>
      </section>

      <section id="game" class="screen hidden">
        <header id="players"></header>
        <div id="board">
          <button id="sound-game" class="sound-toggle" type="button"></button>
        </div>
        <div id="panel">
          <div id="speaker"></div>
          <div id="message"></div>
          <div id="clock" class="hidden"></div>
          <div id="hand"></div>
          <div id="actions"></div>
        </div>
      </section>

      <div id="net-status" class="hidden"></div>
      <div id="dice" class="hidden"></div>
      <div id="cast" class="hidden"></div>
      <div id="modal" class="hidden"><div id="modal-body"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
